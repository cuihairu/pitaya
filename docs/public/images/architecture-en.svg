<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1000" viewBox="0 0 1280 1000" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Pitaya · Framework Architecture</title>
<desc id="desc">Pitaya is a modular, extensible Go game server framework. Clients connect through the libpitaya SDK over TCP or WebSocket acceptors; the App runtime routes messages through a pipeline to user components (handlers and remotes), manages sessions, groups and push, and serializes JSON or Protobuf. Servers discover each other via etcd and call remotes over nats or gRPC. Observability uses Prometheus/statsd and OpenTelemetry/Jaeger. Based on repository packages and documentation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.label{font-size:14px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.dash{stroke-dasharray:7 5}</style>
<rect width="1280" height="1000" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Pitaya · Framework Architecture</text>
<text x="40" y="80" class="body" text-anchor="start">Modular and extensible Go game server framework · acceptor → pipeline → components → cluster RPC</text>

<path d="M330 220 V270" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="client-tcp" data-from="clients" data-to="tcp-acceptor" d="M330 220 V270" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M950 220 V270" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="client-ws" data-from="clients" data-to="ws-acceptor" d="M950 220 V270" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M330 370 V430" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="tcp-app" data-from="tcp-acceptor" data-to="app" d="M330 370 V430" class="edge" style="stroke:#2563eb;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M950 370 V430" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="ws-app" data-from="ws-acceptor" data-to="app" d="M950 370 V430" class="edge" style="stroke:#2563eb;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M330 760 V820" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="app-discovery" data-from="app" data-to="discovery" d="M330 760 V820" class="edge" style="stroke:#087f5b;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M950 760 V820" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="app-rpc" data-from="app" data-to="rpc" d="M950 760 V820" class="edge" style="stroke:#087f5b;stroke-width:2.5" marker-end="url(#arrow)"/>
<path d="M640 870 H660" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="discovery-rpc" data-from="discovery" data-to="rpc" d="M640 870 H660" class="edge" style="stroke:#64748b;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<g id="clients" data-node="clients"><rect x="40" y="130" width="1200" height="90" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="60" y="168" class="name" text-anchor="start">Clients · libpitaya SDK</text>
<text x="60" y="196" class="body" text-anchor="start">iOS · Android · Unity · C# · other pitaya-compatible languages（libpitaya / libpitaya-cluster）</text>
</g>

<g id="tcp-acceptor" data-node="tcp-acceptor"><rect x="40" y="270" width="580" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="60" y="308" class="name" text-anchor="start">TCP Acceptor</text>
<text x="60" y="338" class="body" text-anchor="start">pkg/acceptor · conn · 连接接入</text>
</g>
<g id="ws-acceptor" data-node="ws-acceptor"><rect x="660" y="270" width="580" height="100" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
