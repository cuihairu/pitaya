<text x="680" y="338" class="body" text-anchor="start">pkg/acceptor · conn · 连接接入</text>
</g>

<g id="app" data-node="app"><rect x="40" y="430" width="1200" height="330" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="60" y="468" class="name" text-anchor="start">App · server instance（builder.go / app.go）</text>
<rect x="60" y="480" width="370" height="110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="514" class="body" text-anchor="start">Agent + Session</text>
<text x="80" y="542" class="small" text-anchor="start">会话绑定 user id · 自定义数据</text>
<text x="80" y="566" class="small" text-anchor="start">pkg/agent · pkg/session</text>
<rect x="450" y="480" width="370" height="110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="514" class="body" text-anchor="start">Router + Pipeline</text>
<text x="470" y="542" class="small" text-anchor="start">消息路由 · 中间件链</text>
<text x="470" y="566" class="small" text-anchor="start">pkg/router · pkg/pipeline</text>
<rect x="840" y="480" width="370" height="110" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860" y="514" class="body" text-anchor="start">Components</text>
<text x="860" y="542" class="small" text-anchor="start">Handlers · Remotes · 生命周期</text>
<text x="860" y="566" class="small" text-anchor="start">init / afterinit / shutdown</text>
<rect x="60" y="610" width="370" height="90" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="80" y="644" class="body" text-anchor="start">Groups + Push</text>
<text x="80" y="672" class="small" text-anchor="start">广播组 · 主动推送 · pkg/groups</text>
<rect x="450" y="610" width="370" height="90" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="470" y="644" class="body" text-anchor="start">Serialize</text>
<text x="470" y="672" class="small" text-anchor="start">JSON · Protobuf · 可扩展</text>
<rect x="840" y="610" width="370" height="90" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="860" y="644" class="body" text-anchor="start">Timer + Worker</text>
<text x="860" y="672" class="small" text-anchor="start">定时调度 · worker pool</text>
<text x="60" y="740" class="small" text-anchor="start">扩展面：自定义 Modules（module / modules）· 自定义 Serializer · Reporter 接口（Prometheus / statsd）· OpenTelemetry / Jaeger 追踪 · Config（etcd / nats / 文件）</text>
</g>

<g id="discovery" data-node="discovery"><rect x="40" y="820" width="580" height="100" rx="12" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="60" y="858" class="name" text-anchor="start">Service Discovery · etcd</text>
<text x="60" y="888" class="body" text-anchor="start">pkg/cluster · 服务器注册 / 发现</text>
</g>
<g id="rpc" data-node="rpc"><rect x="660" y="820" width="580" height="100" rx="12" fill="#eef8f5" stroke="#86c9b3" stroke-width="1.5"/>
<text x="680" y="858" class="name" text-anchor="start">RPC · nats / gRPC + Remote</text>
<text x="680" y="888" class="body" text-anchor="start">pkg/rpc · pkg/remote · 跨服调用</text>
</g>

<text x="330" y="412" class="label" text-anchor="middle" style="fill:#2563eb">接入</text>
<text x="950" y="412" class="label" text-anchor="middle" style="fill:#2563eb">接入</text>
<text x="330" y="800" class="label" text-anchor="middle" style="fill:#087f5b">注册 / 发现</text>
<text x="950" y="800" class="label" text-anchor="middle" style="fill:#087f5b">RPC</text>
<text x="650" y="862" class="label" text-anchor="middle">← 路由 →</text>
<text x="40" y="955" class="small" text-anchor="start">A message received by a handler is forwarded to the server of the correct type; remotes receive and process RPC messages. Framework is built on nano's networking layer, inspired by starx and pomelo.</text>
<text x="40" y="980" class="small" text-anchor="start">Solid: data flow · Crossings without a dot are not connections</text>
</svg>
